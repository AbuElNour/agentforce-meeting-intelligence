[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforce-meeting-intelligence"
version = "1.0.0"
description = "Synthetic Agentforce meeting intelligence reference with deterministic evals"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

